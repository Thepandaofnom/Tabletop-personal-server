<p-dialog [(visible)]="visibleLocal" [resizable]="true" [modal]="true" header="Dice Bag" styleClass="dice-bag-dialog" [style]="{width: '40vw'}">
  <div style="display:flex;flex-direction:column;gap:0.75rem;padding:1rem;">
    <label for="resultInput" style="font-weight:600;color:var(--text);">Result</label>
    <input id="resultInput" type="text" [value]="result" readonly maxlength="7" size="7" style="padding:0.5rem;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:#141414;color:var(--text);text-align:center;width:7ch;box-sizing:content-box;" />
    <div style="display:flex;justify-content:center;">
      <button pButton type="button" label="D4" (click)="rollD4()"></button>
    </div>
  </div>
</p-dialog>
