<header class="site-header">
  <div class="container">
    <h1>{{ title() }}</h1>
  </div>
</header>

<div class="main-menu-button-bar container">
  <div class="left-buttons">
    <button pButton type="button" label="Character Sheets" class="pill p-button-outlined"></button>
    <button pButton type="button" label="Game Map" class="pill p-button-outlined" (click)="openGameMap()"></button>
    <button pButton type="button" label="NPC Maker" class="pill p-button-outlined"></button>
    <button pButton type="button" label="Dice Bag" class="pill p-button-outlined" (click)="openDiceBag()"></button>
  </div>

  <div class="hamburger-wrapper">
    <button type="button" class="hamburger p-button-text" (click)="menuOpen = !menuOpen" aria-label="Menu">&#9776;</button>
    <div class="hamburger-menu" *ngIf="menuOpen">
      <ng-container *ngIf="!loggedIn; else loggedTpl">
        <button type="button" class="menu-item p-button-text" (click)="onLogin()">Login</button>
        <button type="button" class="menu-item p-button-text" (click)="onSignup()">Sign up</button>
      </ng-container>
      <ng-template #loggedTpl>
        <button type="button" class="menu-item p-button-text" (click)="onAccount()">Account</button>
      </ng-template>
    </div>
  </div>
</div>

<dice-bag-modal [visible]="diceBagVisible" (visibleChange)="diceBagVisible = $event"></dice-bag-modal>

<game-map-modal [visible]="gameMapVisible" (visibleChange)="gameMapVisible = $event"></game-map-modal>

<new-user-sign-up [visible]="signupVisible" (visibleChange)="signupVisible = $event"></new-user-sign-up>

<main class="main-content">
  <section class="landing">
    <h2>Welcome</h2>
    <p class="lead">This is the Tabletop Personal Server landing page. Use the sidebar or navigation to get started.</p>
  </section>
</main>

<router-outlet />
