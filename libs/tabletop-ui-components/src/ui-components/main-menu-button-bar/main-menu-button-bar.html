<div class="main-menu-button-bar container">
  <div class="left-buttons">
    <button pButton type="button" label="Character Sheets" class="pill p-button-outlined" (click)="onMenuCharacterSheetsClick()"></button>
    <button pButton type="button" label="Game Map" class="pill p-button-outlined" (click)="onGameMapClick()"></button>
    <button pButton type="button" label="NPC Maker" class="pill p-button-outlined"></button>
    <button pButton type="button" label="Dice Bag" class="pill p-button-outlined" (click)="onDiceBagClick()"></button>
  </div>

  <div class="hamburger-wrapper">
    <ng-container *ngIf="loggedIn">
      <button pButton type="button" class="user-btn p-button-text" icon="pi pi-user" style="margin-right:0.5rem" aria-label="Account" (click)="onMenuAccountClick()"></button>
    </ng-container>

    <button type="button" class="hamburger p-button-text" (click)="menuOpen = !menuOpen" aria-label="Menu">&#9776;</button>
    <div class="hamburger-menu" *ngIf="menuOpen">
      <ng-container *ngIf="!loggedIn; else loggedTpl">
        <button type="button" class="menu-item p-button-text" (click)="onMenuLoginClick()">Login</button>
        <button type="button" class="menu-item p-button-text" (click)="onMenuSignupClick()">Sign up</button>
        <button type="button" class="menu-item p-button-text" (click)="onOptionsClick()">Option</button>
      </ng-container>
      <ng-template #loggedTpl>
        <button type="button" class="menu-item p-button-text" (click)="onMenuAccountClick()">Account</button>
        <button type="button" class="menu-item p-button-text" (click)="onMenuLogoutClick()">Logout</button>
        <button type="button" class="menu-item p-button-text" (click)="onOptionsClick()">Option</button>
      </ng-template>
    </div>
  </div>

  <login-modal [visible]="loginVisibleLocal" (visibleChange)="loginVisibleLocal = $event" (loginSuccess)="onLoginModalSuccess($event)"></login-modal>
</div>
