<p-dialog [(visible)]="visibleLocal" [resizable]="true" [modal]="true" header="Dice Bag" styleClass="dice-bag-modal" [style]="{width: '40vw'}">
  <div class="result-container">
    <div class="result-panel">
      <label for="resultInput" class="result-label">Result</label>
      <span id="resultInput" class="result-input">{{ result }}</span>
    </div>
    <div class="dice-options">
      <div class="dice-count">
        <label for="rollCount" class="result-label"># of rolls</label>
        <input id="rollCount" type="number" [(ngModel)]="rollCount" min="0" max="999" step="1" />
      </div>
      <label class="reset-label">
        <input type="checkbox" [(ngModel)]="resetAfterRoll" />
        <span>Reset after roll?</span>
      </label>
    </div>
    <div class="dice-grid pt-3">
      <button class="dice-btn dice-d4" type="button" (click)="rollD4()">
        <span class="dice-label">d4</span>
      </button>
      <button class="dice-btn dice-d6" type="button" (click)="rollD6()">
        <span class="dice-label">d6</span>
      </button>
      <button class="dice-btn dice-d8" type="button" (click)="rollD8()">
        <span class="dice-label">d8</span>
      </button>
      <button class="dice-btn dice-d10" type="button" (click)="rollD10()">
        <span class="dice-label">d10</span>
      </button>
      <button class="dice-btn dice-d12" type="button" (click)="rollD12()">
        <span class="dice-label">d12</span>
      </button>
      <button class="dice-btn dice-d20" type="button" (click)="rollD20()">
        <span class="dice-label">d20</span>
      </button>
      <button class="dice-btn dice-d10 dice-percent" type="button" (click)="rollDPer()">
        <span class="dice-label">d%</span>
      </button>
    </div>
  </div>
</p-dialog>
