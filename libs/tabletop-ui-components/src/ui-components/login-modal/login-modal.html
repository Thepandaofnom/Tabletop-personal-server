<p-toast></p-toast>

<p-dialog [(visible)]="visibleLocal" header="Log in" styleClass="dice-bag-dialog" [modal]="true" [closable]="true" [style]="{width: 'min(92vw, 560px)'}">
  <div class="p-fluid login-content" style="display:flex;flex-direction:column;gap:0.5rem;align-items:center;max-width:100%;padding:1rem;" (keydown.enter)="doLogin()">
    <input pInputText class="login-input" placeholder="Username" [(ngModel)]="username" />
    <p-password class="login-input" [(ngModel)]="password" feedback="false" placeholder="Password"></p-password>
  </div>
  <ng-template pTemplate="footer">
    <div style="display:flex;justify-content:center;gap:0.5rem;flex-wrap:wrap;max-width:100%;padding:0 1rem 1rem;">
      <button pButton type="button" label="Cancel" class="p-button-secondary" (click)="onCancel()"></button>
      <button pButton type="button" label="Login" (click)="doLogin()" [disabled]="loading"></button>
    </div>
  </ng-template>
</p-dialog>
