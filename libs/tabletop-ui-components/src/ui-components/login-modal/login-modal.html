<p-toast></p-toast>

<p-dialog [(visible)]="visibleLocal" header="Log in" styleClass="dice-bag-dialog" [modal]="true" [closable]="true" [style]="{width: '380px'}">
  <div class="p-fluid login-content" style="display:flex;flex-direction:column;gap:0.5rem;align-items:center;">
    <input pInputText class="login-input" placeholder="Username" [(ngModel)]="username" />
    <p-password class="login-input" [(ngModel)]="password" feedback="false" placeholder="Password"></p-password>

    <div style="display:flex;justify-content:center;gap:0.5rem;margin-top:0.5rem;">
      <button pButton type="button" label="Cancel" class="p-button-secondary" (click)="onCancel()"></button>
      <button pButton type="button" label="Login" (click)="doLogin()" [disabled]="loading"></button>
    </div>
  </div>
</p-dialog>
