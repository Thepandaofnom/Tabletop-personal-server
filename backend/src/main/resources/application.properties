# H2 in-memory datasource for development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:tabletop;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Server port (adjust if necessary)
server.port=8081

# Allow large map settings payloads (map images can be several MB as base64)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.mvc.async.request-timeout=60000
server.tomcat.max-http-form-post-size=52428800
server.tomcat.max-swallow-size=52428800

# JWT settings — override JWT_SECRET env var in production
jwt.secret=${JWT_SECRET:change-me-please-change-to-a-long-secret-32chars!}
jwt.expirationMs=86400000
