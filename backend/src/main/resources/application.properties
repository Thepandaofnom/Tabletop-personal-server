# H2 in-memory datasource for development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:tabletop;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Server port (adjust if necessary)
server.port=8081

# JWT settings (change secret for production)
jwt.secret=change-me-please-change-to-a-long-secret-32chars!
jwt.expirationMs=86400000
