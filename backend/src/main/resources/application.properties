spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:tabletop}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Server port (adjust if necessary)
server.port=8081

# Allow large map settings payloads (map images can be several MB as base64)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.mvc.async.request-timeout=60000
server.tomcat.max-http-form-post-size=52428800
server.tomcat.max-swallow-size=52428800

# JWT settings — override JWT_SECRET env var in production
jwt.secret=${JWT_SECRET:change-me-please-change-to-a-long-secret-32chars!}
jwt.expirationMs=86400000
