spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:tabletop}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Server port — Railway injects $PORT (usually 8080); fall back to 8081 locally
server.port=${PORT:8081}
# The deployed frontend is on a different site, so its XHR requests need a
# cross-site session cookie. Railway terminates HTTPS before forwarding here.
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework

# Allow large map settings payloads (map images can be several MB as base64)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.mvc.async.request-timeout=60000
server.tomcat.max-http-form-post-size=52428800
server.tomcat.max-swallow-size=52428800
